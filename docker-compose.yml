services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-emission}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-emission}
      POSTGRES_DB: ${DB_NAME:-emission_db}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  generator:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432  # container-internal port; DB_PORT above is the host mapping
      DB_USER: ${DB_USER:-emission}
      DB_PASSWORD: ${DB_PASSWORD:-emission}
      DB_NAME: ${DB_NAME:-emission_db}
    command: >
      sh -c "python -m synthetic_data_generation.generate_data &&
             python -m synthetic_data_generation.report"

volumes:
  pgdata:
